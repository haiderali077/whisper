worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Hash the authenticated JWT, not IP: two users on one laptop/NAT can
    # reach different nodes while one user's polling session stays on its node.
    map $cookie_jwt $socket_affinity {
        default $cookie_jwt;
        '' $remote_addr;
    }
    upstream api_nodes {
        zone api_nodes 64k;
        server backend1:5001 resolve max_fails=1 fail_timeout=5s;
        server backend2:5001 resolve max_fails=1 fail_timeout=5s;
    }
    upstream socket_nodes {
        zone socket_nodes 64k;
        hash $socket_affinity consistent;
        server backend1:5001 resolve max_fails=1 fail_timeout=5s;
        server backend2:5001 resolve max_fails=1 fail_timeout=5s;
    }
    server {
        listen 80;
        client_max_body_size 2m;
        # Overwrite incoming forwarding headers; do not trust client-supplied IPs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        location /socket.io/ {
            # Repeat inherited headers because this location adds upgrade headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://socket_nodes;
        }
        location / {
            proxy_pass http://api_nodes;
        }
    }
}
